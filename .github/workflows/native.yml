name: native build

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read # the differential tests download the latest reference-build artifact

jobs:
  windows-x86:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build (clang-cl, x86)
        shell: cmd
        run: port\tools\win-build.cmd win-x86-clangcl

      - name: Smoke test (starts, rejects a folder without the game's resources, writes nothing there)
        shell: pwsh
        env:
          BAK_HEADLESS: "1"
          SDL_VIDEO_DRIVER: dummy
        run: |
          # The game cannot run without its resources, which CI does not have; the
          # executable must start, bring up SDL and turn down a folder whose KRONDOR.RMF
          # is not a resource index (exit 1). A crash or a hang fails the job.
          function Invoke-Port([string[]] $arguments) {
            $p = Start-Process build\win-x86-clangcl\betterkrondor.exe -ArgumentList $arguments `
                   -NoNewWindow -PassThru -RedirectStandardError smoke.err
            $null = $p.Handle
            if (-not $p.WaitForExit(30000)) { $p.Kill(); Get-Content smoke.err; throw "hung" }
            Get-Content smoke.err
            if ($p.ExitCode -ne 1) { throw ("exit code 0x{0:X8}" -f $p.ExitCode) }
            if (-not (Select-String -Quiet -Path smoke.err -Pattern "not a resource index")) {
              throw "the incomplete game folder was not reported"
            }
          }
          $data = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\fakedata"
          Set-Content "$data\KRONDOR.RMF" "" -NoNewline
          # No settings and no --user: the per-user folder is made, and nothing is remembered.
          Invoke-Port @('--data', $data)
          $prefs = "$env:APPDATA\BetterAtKrondor"
          if (-not (Test-Path $prefs)) { throw "no per-user folder" }
          if (Test-Path "$prefs\betterkrondor.ini") { throw "a folder without the game was remembered" }
          # Settings naming the game folder, and no --data: that folder is checked, and the
          # settings stay as they were.
          $user = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\fakeuser"
          $ini = "; kept`r`n[paths]`r`ndata = $data`r`n[later]`r`nkey = value`r`n"
          Set-Content "$user\betterkrondor.ini" $ini -NoNewline
          Invoke-Port @('--user', $user)
          if ((Get-Content -Raw "$user\betterkrondor.ini") -ne $ini) { throw "the settings changed" }
          # The game folder is as it was.
          $files = @(Get-ChildItem -Force -Recurse $data)
          if ($files.Count -ne 1) { throw "the game folder was written: $($files.Name)" }

      - name: Unit tests (the port's own code; no game data needed)
        shell: cmd
        run: build\win-x86-clangcl\bak_unittest.exe

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Pointer audit (16-bit pointer habits the diagnostics let through)
        shell: bash
        run: uv run python -I port/tools/ptrwidth_audit.py

      - name: Warning ratchet (no category's count may rise)
        shell: bash
        run: uv run python -I port/tools/warning_ratchet.py

      - name: Fetch the reference artifacts (latest successful reference build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow reference.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ] || ! gh run download "$run" -n "reference-$run" -D work/ref; then
            echo "::warning::No reference artifacts available: the differential tests will skip"
          fi

      - name: Differential tests (originals in Unicorn vs the C translations)
        shell: bash
        env:
          BAK_DIFFTEST_EXE: build/win-x86-clangcl/bak_difftest.exe
        run: uv run --group difftest pytest -q -rs port/tests

  linux-x86-game:
    # Compile-only portability check of the game sources (no SDL) on a 32-bit Linux target.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build gcc-multilib

      - name: Compile the game sources (clang -m32)
        run: |
          cmake --preset linux-x86 -DBAK_BUILD_PORT=OFF
          cmake --build --preset linux-x86 --target bakgame
